# ─────────────────────────────────────────────────────────────────────────────
# regen-gates.yml — the regeneration-idempotence and standalone-smoke gates,
# ported from GitLab CI to GitHub Actions. THE .gitlab-ci.yml FILE WAS THE
# SPECIFICATION: every command, every flag, every budget and every WHY-comment
# below is carried across from it rather than re-invented here. Nothing in this
# file was taken from a tutorial or a blog.
#
# REPLACES THESE RANGES OF .gitlab-ci.yml (the file stays, because GitLab is
# demoted to exactly one job — private/public separation, D-035 — so it is still
# the record of what used to run here):
#
#   .gitlab-ci.yml:1-31     header comments · stages (guard/verify/regen/
#                           host-install/pg/mysql/warm/agent-verify/mirror) and
#                           the note that the list outgrew "four" since it was
#                           written
#   .gitlab-ci.yml:54-68    GIT_DEPTH: 0 → `fetch-depth: 0`
#   .gitlab-ci.yml:70-103   COMPOSER_PROCESS_TIMEOUT: "3600"
#   .gitlab-ci.yml:105-136  the .php-setup anchor
#   .gitlab-ci.yml:138-157  the composer `cache:` block
#   .gitlab-ci.yml:159-169  `default: interruptible: true`
#   .gitlab-ci.yml:237-252  verify:8.3, for the `composer smoke` step this file
#                           lifts out into its own job
#   .gitlab-ci.yml:253-266  verify:8.4, same
#   .gitlab-ci.yml:410-435  regen-idempotence (stage regen)
#   .gitlab-ci.yml:437-470  host-install (stage host-install) — ported, but to
#                           ITS OWN workflow: .github/workflows/host-install.yml
#                           rather than a job here. It needs its own
#                           `concurrency:` group with `cancel-in-progress:
#                           false`, and a group is per-WORKFLOW in Actions, so
#                           porting it as a job HERE would have serialised this
#                           file's gates against it and handed it the one
#                           cancellation behaviour its source refuses. Read
#                           the block at the end of THIS file for why the
#                           original "cannot move to a public runner" reasons no
#                           longer hold.
#
# ── WHAT "GENERATION IDEMPOTENCE" MEANS, so the job is not read as a formality.
# ── Every generated artifact in this repository is committed, and committed
# ── artifacts that carry an `@generated` marker are NEVER hand-edited
# ── (AGENTS.md, "Generated artifacts"). That creates the failure this gate
# ── exists for: someone edits a generated model by hand, or changes a `.tl`
# ── scheme and forgets to re-run the generator, and the committed tree quietly
# ── stops being what the generator produces. Nothing else in CI can see that —
# ── the suite still passes against the edited tree. THIS gate is the only thing
# ── that compares the committed bytes against a FRESH generation, so a drifted
# ── tree is red here and nowhere else.
#
# ── THE SCHEMA SOURCES (`src/Schema/schema/**`) ARE THE ONE TREE THIS JOB DOES
# ── NOT REGENERATE, and the reason is mechanical rather than a policy choice:
# ── `bin/regenerate` reads `.tl` schemes from that tree and writes ONLY to
# ── `<out>/src/Schema/Generated/**` and (with `--ship`) to
# ── `<out>/src/Laravel/Migrations/**`. It is the INPUT, not the output; it is
# ── updated by `php artisan teleframe:schema-update` (diff + regenerate +
# ── stamp, does not migrate), which is a different gate. Diffing the committed
# ── `src/Schema/schema/**` against a temp regeneration would therefore be a
# ── guaranteed red — the temp run never writes there. What this job DOES assert
# ── about that tree is the property that is actually meaningful and checkable:
# ── that the regeneration leaves it byte-for-byte untouched, i.e. treats the
# ── schemes as read-only inputs. See the "Schema sources are READ-ONLY inputs"
# ── step.
#
# ── WHY THE SETUP BLOCK IS REPEATED INSTEAD OF BEING A COMPOSITE ACTION.
# GitLab expressed it as the anchor `.php-setup: &php-setup` and every job
# merged it. GitHub Actions has NO YAML anchors and no merge-key syntax at all,
# so the only way to share the block is a composite action under
# .github/actions/. That is deliberately NOT done here: several lanes are porting
# their jobs out of the same .gitlab-ci.yml in parallel right now, and a shared
# .github/actions/php-setup is a write-write collision on a file nobody owns. It
# is owed, it is named, and it is not created while the port is in flight — an
# inline copy per job is duplicated, but each job stays independently readable
# and independently editable, which is what a reviewer of one lane needs.
#
# ── ON `libicu-dev` + `intl`, WHICH IS A HARD REQUIREMENT AND NOT TIDINESS.
# composer.json requires `ext-intl`, and Normalizer is what makes message search
# tokens NFC-canonical (MessageSearchIndexer::toNfc). The official `php:*-cli`
# images ship NONE of it — not libicu-dev, not intl — and `bin/regenerate` and
# `bin/standalone-smoke.php` both boot the composer autoloader, which resolves
# the platform requirement on `require __DIR__.'/../vendor/autoload.php'`. A
# sibling lane in this port omitted both lines and EVERY job in that workflow went
# red on the platform requirement before a single line of this project's own
# verification ran. It reads as a total CI outage rather than as one extension,
# which is exactly why the two lines are called out here rather than left inside
# a long apt list.
#
# ── CONVENTIONS CARRIED FROM THE SOURCE. Em-dashes instead of ": " inside
# ── unquoted messages, for the reason recorded at .gitlab-ci.yml:196-199 (a
# ── bare YAML scalar containing ": " is parsed as a MAPPING, and a whole
# ── pipeline then fails to lint). Every message a step prints is therefore
# ── safe in a `run:` block without quoting.
# ─────────────────────────────────────────────────────────────────────────────

name: regen-gates

# `default: interruptible: true` (.gitlab-ci.yml:159-169) → this is its
# Actions-native form. GitLab's reason, carried: a newer pipeline supersedes an
# older one on the same branch, so the older run is wasted runner time. GitLab
# had to put it under `default:` because it rejects `interruptible` at the root
# with "jobs concurrent config should implement the script:, run:, or trigger:
# keyword"; Actions has no such lint, so the root is correct here.
#
# Neither job below is `interruptible: false` in the source: `host-install` and
# `warm-live-host` opt out because they MUTATE A HOST. These two write only
# inside their own container and their own /tmp, so the cancellation policy is
# carried unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# .gitlab-ci.yml:43-52 `workflow: rules:` ran the ordinary gates on push and
# merge-request, and ADDED (not replaced) schedule/api/web so a nightly pipeline
# could reach the warm lane. No `schedule:` is registered in THIS file on
# purpose: the GitLab cron existed to reach `warm-live-host`, which is
# `when: never` and is not ported into this file. Registering one here would burn
# hosted minutes on a schedule whose only purpose was to reach a disabled lane.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. These gates read the repository and generate into their own
# throwaway /tmp directories; nothing here pushes, publishes, or writes a package.
permissions:
  contents: read

# Deterministic shell. The `php:8.4-cli` image's /bin/sh is dash, and the GitLab
# fences below were written against a bash-ish shell on the GitLab runner;
# naming bash makes the port's semantics explicit instead of inheriting the
# container's.
defaults:
  run:
    shell: bash

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # regen-idempotence — regeneration idempotence (stage regen,
  # .gitlab-ci.yml:410-435)
  #
  # "regen -> regeneration idempotence (two temp runs, byte-identical) +
  #  committed-artifact drift check + Schema/DataCore suites" — the stage-list
  #  comment at .gitlab-ci.yml:11-13, carried.
  #
  # `image: php:8.4-cli` is GitLab's shape. Its Actions-native equivalent is a
  # JOB CONTAINER — deliberately not `runs-on: ubuntu-latest` with a hand
  # installed PHP: it is the faithful port of the image, and it is what makes
  # `docker-php-ext-install` available, because that function ships IN the
  # php:*-cli images and nowhere else.
  # ───────────────────────────────────────────────────────────────────────────
  regen-idempotence:
    name: regen-idempotence (two temp runs byte-identical + drift)
    runs-on: ubuntu-latest
    # RAISED 30 -> 60, and here is the measurement that forced it. On Actions
    # this job was CANCELLED at 08:38:53 -> 09:09:01 — exactly 30 minutes, which
    # is what an expired `timeout-minutes` looks like; it is not a concurrency
    # race, and there was no newer commit to supersede it. It reproduced on a
    # manual re-run of the failed jobs.
    #
    # The budget was carried from GitLab's `timeout: 30m` unchanged, with a
    # comment insisting the number must not be rounded or raised so the red
    # would mean the same thing in both systems. That reasoning is sound and the
    # conclusion was wrong: in GitLab the 30m covered `before_script` and an
    # image pull, whereas here `timeout-minutes` starts before the container is
    # pulled, so the SAME number buys strictly less work.
    #
    # What the job actually needs, measured on this machine:
    #   vendor/bin/phpunit tests/Schema tests/DataCore   1385s (23m) on its own
    # plus apt build deps + PHP extensions, composer install, and the two
    # regeneration runs. The PHPUnit step alone exceeds half the old budget.
    # 60m is ~2x the measured requirement, so a slower runner still fits while a
    # genuinely wedged job still dies visibly.
    timeout-minutes: 60
    container: php:8.4-cli
    env:
      # .gitlab-ci.yml:70-103, carried with its sizing reasoning. Composer's
      # process-timeout is 300s by default and composer runs every step below as
      # ONE child process, so a default timeout here kills the job rather than
      # reporting a result.
      #
      # 3600 is sized against the SHARD budget (1800s of measured test time,
      # ci/shard-timings.md, with 2x headroom for a runner slower than the one
      # measured on) rather than against this job's own runtime, because the
      # SIBLING lanes in this port share the number and one number that fits only
      # one job is not a number. It is deliberately NOT tightened here: a job that
      # does not need the budget has no business deciding that another job may not
      # have it, and the pipeline-level `timeout-minutes` above is what actually
      # bounds this job.
      #
      # A gate that flips on machine speed is not a gate, it is a coin — the
      # source's own words, recorded because pipeline #271 was green minutes
      # before #275 died at 74% with `The process "phpunit" exceeded the timeout
      # of 300 seconds` on essentially the same suite.
      COMPOSER_PROCESS_TIMEOUT: "3600"
      # Root in the container. Without this, composer prints a loud warning per
      # command and the cache below is written by a user the runner's cleanup
      # does not look for.
      COMPOSER_ALLOW_SUPERUSER: "1"
      # Point composer AT the directory the cache step stores, so the cache is a
      # real warm cache rather than a directory nothing ever writes to. On Linux
      # composer's default cache dir is ~/.cache/composer, which is NOT the
      # ~/.composer/cache/ the source cached; this pins it to the source's path
      # on purpose so the port and the original warm the same bytes.
      COMPOSER_CACHE_DIR: /root/.composer/cache
    steps:
      # ── SETUP FIRST, BEFORE CHECKOUT, AND THE ORDER IS LOAD-BEARING ─────────
      # .php-setup (.gitlab-ci.yml:105-136), inlined because Actions has no
      # anchor syntax (see the header).
      #
      # WHY IT RUNS BEFORE CHECKOUT HERE, which is the reverse of a conventional
      # Actions file: `php:8.4-cli` DOES NOT SHIP GIT. actions/checkout then
      # falls back to downloading a REST API tarball instead of cloning, and a
      # tarball has NO HISTORY — which would silently reduce `fetch-depth: 0`
      # (see the checkout step) to the exact "disabled gate" the source calls a
      # non-negotiable. Installing git first is what makes the full-history
      # requirement real rather than merely written down. GitLab's runner injects
      # its own tooling and never had this problem; Actions does not.
      - name: Apt build deps + PHP extensions + composer (was .php-setup)
        run: |
          set -euo pipefail
          # Unlike credential-guard, these packages are NOT optional:
          # docker-php-ext-install below compiles against libgmp-dev / libzip-dev
          # / libpq-dev / libicu-dev, and the job cannot run its suite without the
          # extensions they build. So a failure here IS fatal — but it is reported
          # as a NAMED environment failure rather than left as an anonymous apt
          # exit code, so the next reader can tell "the runner is broken" from
          # "the package is broken" without opening the job log archaeology.
          # `--no-install-recommends` + the clean below are what keep the archives
          # from becoming the next "not enough free space in /var/cache/apt/archives".
          apt-get update -qq || echo "apt-get update FAILED on this runner — if the next line fails too, this is a RUNNER disk/network problem, not a package problem"
          apt-get install -y -qq --no-install-recommends git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev >/dev/null || { echo "FATAL — apt could not install the REQUIRED build deps (git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev)."; echo "        docker-php-ext-install cannot build gmp/zip/pdo_pgsql/intl without them, so this job cannot verify anything."; echo "        If the message above mentions free space or an unsigned repo, the RUNNER is degraded and no code was tested."; exit 1; }
          apt-get clean && rm -rf /var/lib/apt/lists/*
          # `intl` is here for a named reason, not for tidiness: composer.json
          # requires ext-intl, and Normalizer is what makes message search tokens
          # NFC-canonical (MessageSearchIndexer::toNfc). Without it
          # `composer install` fails on the platform requirement in EVERY job
          # that uses this anchor, so a missing line here reads as a total CI
          # outage rather than as one extension. libicu-dev is the build
          # dependency; the official php:*-cli images ship none of this, exactly
          # like bcmath/gmp/zip above.
          docker-php-ext-install bcmath gmp zip pdo_pgsql sockets intl >/dev/null
          # The official php:*-cli images ship memory_limit=128M. The full suite
          # peaks around 235M (it fatals in guzzlehttp/psr7 Stream inside
          # AwsSdkS3GatewayTest at 128M), so raise it before anything runs rather
          # than letting a container default decide whether the gate passes.
          printf "memory_limit=1G\n" > /usr/local/etc/php/conf.d/ci-memory.ini
          php -r 'printf("memory_limit=%s\n", ini_get("memory_limit"));'
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --quiet
          composer --version

      # GIT_DEPTH: 0 → `fetch-depth: 0`. NON-NEGOTIABLE, and the reasoning is
      # carried from .gitlab-ci.yml:54-68 because this is the single setting most
      # likely to be "tidied up" by someone who has not read what it is for.
      #
      # A SHALLOW CLONE IS A DISABLED GATE, not a speed optimisation.
      #
      # bin/scan-credentials.php scans git HISTORY for committed session strings.
      # At the default depth 20 the runner's object set is truncated, so the guard
      # could not see an exposure 84 commits back — while still printing
      # "history depth all reachable from all". Pipeline #206 was GREEN on the
      # credential-guard job with a live Telegram session sitting outside the
      # window, and the only visible symptom was an unrelated test asserting a
      # receipt that the truncated clone could not reach.
      #
      # GIT_DEPTH: 0 fetches the full history, so the guard's coverage claim
      # becomes true and the receipt ratchet in
      # tests/Credentials/RepositoryGuardTest.php can pass honestly. Clone time is
      # the cost; a gate that cannot see is not a gate.
      #
      # It is kept on THIS job even though this job never calls the guard,
      # because the shallow-checkout failure mode is not per-job — it is a
      # property of whatever the checkout step degrades into, and a job that
      # clones shallow trains the next reader to think shallow is acceptable.
      #
      # actions/checkout@v4 handles the git `safe.directory` ownership question
      # itself (the checkout writes files owned by root while the container's
      # workspace is owned by the runner user), so no manual `git config
      # --global --add safe.directory` is added here — that would be a second
      # home for the same fix.
      - name: Checkout (FULL history — see the fetch-depth comment)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PROVE THE HISTORY IS THERE, mechanically, because "NON-NEGOTIABLE" that
      # nothing checks is a wish. The check is seconds-long, not a test suite.
      #
      # The threshold is 20 because 20 is Actions' DEFAULT depth: any count at or
      # below it is the signature of a truncated fetch (including the
      # checkout-fallback-without-git case described above, which yields 1). The
      # repository has hundreds of commits, so 20 is a floor that cannot produce
      # a false red while catching every truncation.

      # `actions/checkout@v4` does NOT mark the checkout as safe. The Actions
      # runner checks the tree out as a different UID than the job shell runs
      # as, so every `git` command afterwards refuses with `fatal: detected
      # dubious ownership in repository at '$GITHUB_WORKSPACE'` and exits 128.
      # Measured: the public-surface gate failed exactly this way, and
      # `git ls-files` is how that gate enumerates the public surface — so
      # this step is load-bearing for it, not a convenience.
      - name: Trust the checkout (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Assert the clone is NOT shallow (a disabled gate must fail loudly)
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          shallow=$(git rev-parse --is-shallow-repository)
          echo "commits reachable from HEAD — ${count} (shallow=${shallow})"
          echo "commits reachable from HEAD — ${count}"
          if [ "$shallow" = "true" ]; then
            echo "FATAL — the clone is shallow (${count} commits). bin/scan-credentials.php"
            echo "        scans git HISTORY, so a shallow clone turns the credential guard into a"
            echo "        no-op that still prints a success message. This is a DISABLED GATE, not a"
            echo "        speed optimisation. Fix `fetch-depth` before reading anything else."
            exit 1
          fi

      # Composer cache. Ported from .gitlab-ci.yml:138-157, keeping its INTENT and
      # its reasoning rather than its syntax:
      #
      # Project-namespaced and lockfile-keyed, NOT a bare ref slug.
      #
      # A ref-slug key minted a BRAND NEW cache directory per branch, so
      # ~/.composer/cache was re-downloaded from scratch on every fresh branch and
      # never shared between them. The slug also carried no project name, so the
      # key space collided with the other CI projects sharing that one bare-metal
      # runner — and cache collisions between projects serve each other the wrong
      # packages. The Actions form of that failure would be `${{ github.ref }}` or
      # `github.head_ref` in the key, and it is therefore DELIBERATELY ABSENT.
      #
      # This repository is a LIBRARY and .gitignore excludes composer.lock, so
      # `hashFiles('composer.lock')` resolves to the EMPTY STRING today — the
      # direct equivalent of the `files:` list resolving to nothing and GitLab
      # falling back to the static `prefix`. One shared, project-namespaced
      # directory for every branch is the intended outcome, and the hash is kept
      # so the key starts tracking the real lockfile the moment the project
      # commits one.
      #
      # The cross-project collision cannot recur on GitHub-hosted runners, because
      # a repository's Actions cache is already scoped to that repository. The
      # explicit `teleframe` segment is kept anyway: it costs nothing, it makes
      # the key read identically to the one it replaces, and it keeps the key
      # unique if a self-hosted runner with a shared cache is ever reintroduced.
      - name: Composer cache (project-namespaced, lockfile-keyed, NOT ref-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: teleframe-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            teleframe-composer-${{ runner.os }}-

      # .gitlab-ci.yml:416 — `composer install --no-interaction --prefer-dist`,
      # WITHOUT `--no-scripts`. (verify-shards at .gitlab-ci.yml:397 does pass
      # `--no-scripts`; that job runs the shards and owns that decision. This job
      # generates and must let the package's own scripts run, so the source's
      # exact flag list is kept rather than "corrected" to match a sibling.)
      - name: composer install
        run: composer install --no-interaction --prefer-dist

      # ── HALF ONE: TWO TEMP RUNS, BYTE-IDENTICAL ────────────────────────────
      # .gitlab-ci.yml:417-419, carried verbatim.
      #
      # The CLI surface is read from bin/regenerate and
      # src/Laravel/Console/RegenerateCommand.php, not guessed:
      #   php bin/regenerate [--force] [--schemas=DIR] [--out=DIR] [--ship] [--prune]
      # `--out` places artifacts at `<out>/src/Schema/Generated/`; without it the
      # generator writes into the PACKAGE ROOT, i.e. it would overwrite the
      # committed tree — which is precisely the mistake this gate exists to
      # avoid. `--force` is deliberately NOT passed: it bypasses the ±30%
      # constructor-count sanity gate, and removing that gate would let a schema
      # change that silently lost most of its types pass as a clean generation.
      # `--prune` is NOT passed either: it only has meaning together with `--ship`
      # and it DELETES files, and a gate that deletes files is not a gate.
      #
      # TWO temp dirs, not one, because the property under test is that generation
      # is a function of the tracked schemes alone — reproducible, with no hidden
      # carry-over from a previous run's leftovers.
      - name: Regenerate twice into two temp trees (/tmp/regen-a, /tmp/regen-b)
        run: |
          set -euo pipefail
          rm -rf /tmp/regen-a /tmp/regen-b
          php bin/regenerate --out=/tmp/regen-a
          php bin/regenerate --out=/tmp/regen-b
          echo "regen-a — $(find /tmp/regen-a -type f | wc -l) files"
          echo "regen-b — $(find /tmp/regen-b -type f | wc -l) files"

      # .gitlab-ci.yml:420, carried verbatim. `diff -r` and not `cmp`: the two runs
      # produce whole TREES, and a tree comparison also catches a file present in
      # one run and absent from the other, which a per-file checksum loop with a
      # `nullglob` bug would not.
      - name: The two temp runs must be byte-identical
        run: diff -r /tmp/regen-a/src/Schema/Generated /tmp/regen-b/src/Schema/Generated

      # ── HALF TWO: COMMITTED-ARTIFACT DRIFT ─────────────────────────────────
      # .gitlab-ci.yml:421-434, carried verbatim including the reason it is
      # phrased this way.
      #
      # The committed tree is compared against a FRESH generation rather than being
      # regenerated in place. This line used to be `php bin/regenerate` followed by
      # `git status`, which DELETED src/Schema/Generated and rebuilt it in the
      # workspace on every push — and then certified the result as idempotent. The
      # gate could not catch the deletion because the deletion was the operation
      # under test; it compared a destroyed tree against itself and called that a
      # pass (D-029). Comparing /tmp/regen-a against the committed tree proves the
      # same property — the checked-in content is what a fresh generation produces —
      # without a pipeline ever deleting a tracked directory.
      #
      # EVERY FILE in src/Schema/Generated/** carries an `@generated` marker and is
      # never hand-edited (AGENTS.md, "Generated artifacts"); a difference here IS
      # the gate firing, not a formatting nuisance.
      #
      # In GitLab the `{ ...; }` fence had to be quoted because an unquoted
      # `{ ...; }` is parsed as a YAML flow MAPPING and the whole pipeline fails
      # to lint with "script config should be a string or a nested array of
      # strings". Inside an Actions `run:` block there is no YAML scalar to
      # misparse, so the same fence is written directly.
      - name: Committed Generated tree must equal a fresh generation (drift IS the gate)
        run: |
          diff -r /tmp/regen-a/src/Schema/Generated src/Schema/Generated || { echo "ERROR: src/Schema/Generated drift — run php bin/regenerate and commit the result"; exit 1; }

      # ── ADDED COVERAGE BEYOND THE SOURCE, and it is labelled as such ───────
      # The source job has a REAL HOLE, found by reading bin/regenerate rather
      # than by running it: `src/Laravel/Migrations/**` is a committed generated
      # tree (57 files) that ONLY `--ship` writes
      # (src/Laravel/Console/RegenerateCommand.php:19,
      # src/Schema/Generator/SchemaRegenerator.php:304), and the source job's
      # script (.gitlab-ci.yml:417-419) never passes `--ship`. So the source
      # drift-checks `src/Schema/Generated` and nothing else: the curated ship
      # dial can drift from a committed tree and stay green forever.
      #
      # The check below closes that hole. It is NOT a claim that the source had
      # it — it did not — and it is not a guess: the flags and the written path
      # are read off the CLI surface above.
      #
      # WHY THIS COMPARISON IS A PER-FILE LOOP AND NOT `diff -r`. The committed
      # ship directory is NOT purely generated. SchemaRegenerator ships a curated
      # SUBSET of the layer's per-type migrations (DEFAULT_SHIP_NAMESPACES =
      # auth, messages, users, channels, updates, help, contacts —
      # SchemaRegenerator.php:27) into a directory that also holds hand-authored
      # migrations and an APP_OWNED_MIGRATIONS allow-list
      # (SchemaRegenerator.php:260, :322). `diff -r /tmp/.../Migrations
      # src/Laravel/Migrations` would report every hand-authored file as "Only in"
      # and be red on a perfectly healthy tree — a guaranteed false red, which is
      # worse than no gate. The meaningful direction is therefore ONE WAY: every
      # file the generator PRODUCES must exist in the committed tree and be
      # byte-identical. That is the whole drift property for this directory.
      - name: Ship run (+--ship) — every GENERATED curated migration must match the committed tree
        run: |
          set -euo pipefail
          rm -rf /tmp/regen-ship
          php bin/regenerate --out=/tmp/regen-ship --ship
          produced=/tmp/regen-ship/src/Laravel/Migrations
          committed=src/Laravel/Migrations
          if [ ! -d "$produced" ]; then
            echo "FATAL — --ship wrote no $produced. The gate cannot check src/Laravel/Migrations"
            echo "        drift, and a silent skip would be an invisible disabled gate. Treat this as"
            echo "        a CLI change to bin/regenerate, not as a clean tree."
            exit 1
          fi
          shopt -s nullglob
          files=("$produced"/*.php)
          if [ "${#files[@]}" -eq 0 ]; then
            # ZERO IS THE CONTRACT HERE, NOT A FAILURE. The curated dial is
            # hand-authored: `ShipDialGoldenTest` documents it at line 22 as
            # "bin/regenerate --ship is a no-op (no generated migrations to
            # copy)", and that gate passes today (OK, 6 tests). This step
            # asserted the opposite and has therefore been red on every run
            # since it was written — a permanently-red gate is not a gate.
            #
            # Asserting the real invariant instead, which is STRONGER than
            # asserting "0": the shipped count must EQUAL the number of
            # committed migrations carrying the GENERATED banner. That fails
            # both ways — a generated migration that is not being shipped, and
            # a shipped file with no committed counterpart (the loop below).
            committed_generated=0
            # Match CodeWriter::BANNER (`// GENERATED — do not edit; run artisan
            # teleframe:regenerate`). A bare `grep -q GENERATED` is NOT enough and
            # measured 2 on a tree that has NO generated migration at all: those
            # hits are the words `DEFAULT_GENERATED` inside a MySQL column
            # comment. The em-dash is a wildcard so a dash-convention change
            # cannot silently turn this into a green no-op.
            for c in src/Laravel/Migrations/*.php; do
              grep -qE "GENERATED . do not edit" "$c" && committed_generated=$((committed_generated + 1))
            done
            if [ "$committed_generated" -ne 0 ]; then
              echo "FATAL — --ship shipped 0 curated migrations but $committed_generated committed"
              echo "        migration(s) carry the GENERATED banner."
              echo "        Those two facts are the same fact: a generated migration exists that the"
              echo "        ship dial is not copying. The no-op contract has been broken."
              exit 1
            fi
            echo "curated ship migrations: 0 shipped, 0 GENERATED-banner migrations committed."
            echo "        Consistent — the curated dial is hand-authored, so --ship is a no-op by"
            echo "        contract (ShipDialGoldenTest). Both directions of the count agree."
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            name=$(basename "$f")
            if [ ! -f "$committed/$name" ]; then
              echo "DRIFT — $name is regenerated but NOT present in $committed — run: php bin/regenerate --ship, then commit $committed/$name"
              fail=1
            elif ! cmp -s "$f" "$committed/$name"; then
              echo "DRIFT — $name differs from $committed/$name — run: php bin/regenerate --ship, then commit the result"
              fail=1
            fi
          done
          echo "curated ship migrations checked — ${#files[@]} generated, all byte-identical or listed above"
          [ "$fail" -eq 0 ]

      # The OTHER direction for the ship directory, which the loop above cannot
      # express: a GENERATED-banner migration that the generator no longer
      # produces is stale. The banner string is read off
      # SchemaRegenerator.php:283 (`GENERATED — do not edit`); the em-dash is
      # matched with a wildcard rather than pasted literally so a dash-convention
      # change cannot silently turn this check into a green no-op. Hand-authored
      # migrations carry no banner and are deliberately out of scope, which is the
      # same classification shipMigrations() itself uses (:322-326).
      - name: No STALE generated migration is left committed in the ship directory
        run: |
          set -euo pipefail
          produced=/tmp/regen-ship/src/Laravel/Migrations
          shopt -s nullglob
          stale=0
          for c in src/Laravel/Migrations/*.php; do
            name=$(basename "$c")
            # The PRECISE banner, not a bare `grep -q GENERATED`. Measured: a bare
            # GENERATED matches 2 files on a tree with NO generated migration,
            # because MySQL column comments say `DEFAULT_GENERATED`. Both would
            # then be reported STALE — a false alarm on hand-authored files, from
            # the step whose whole job is to name stale GENERATED files.
            grep -qE "GENERATED . do not edit" "$c" || continue
            if [ ! -f "$produced/$name" ]; then
              echo "STALE — $c carries a GENERATED banner but --ship no longer produces it."
              echo "         Either the scheme lost that namespace, or the curated dial changed."
              echo "         Re-run: php bin/regenerate --ship --prune  (prune only ever unlinks GENERATED-banner files)"
              stale=1
            fi
          done
          [ "$stale" -eq 0 ]

      # ── WHAT THE SOURCE'S `git status` NEVER CHECKED, AND CAN ───────────────
      # src/Schema/schema/** is the generator's INPUT tree (the .tl schemes and
      # the derived catalog JSON), not an output tree — see the file header. The
      # property that IS meaningful for it is that regeneration treats it as
      # read-only. The old source form of this gate was `php bin/regenerate`
      # followed by `git status`, so any write into the input tree would have
      # been indistinguishable from the drift it was looking for; now that the
      # regeneration writes only to /tmp, `git status` on this path has exactly
      # one possible meaning: the generator touched its own inputs.
      #
      # `--porcelain` because a human-readable `git status` is not machine-stable.
      # `src/Schema/schema` is the pathspec, so the check is scoped to that tree
      # rather than to the whole worktree — a sibling lane's in-flight edits must
      # not be able to fail this job.
      - name: Schema sources are READ-ONLY inputs (regeneration must not touch them)
        run: |
          set -euo pipefail
          touched=$(git status --porcelain -- src/Schema/schema)
          if [ -n "$touched" ]; then
            echo "FATAL — the regeneration modified its own INPUT tree src/Schema/schema/**:"
            echo "$touched"
            echo "        bin/regenerate reads the schemes and writes only <out>/src/Schema/Generated/**"
            echo "        (and <out>/src/Laravel/Migrations/** with --ship). A write here means the"
            echo "        generator and its inputs moved apart."
            exit 1
          fi
          echo "src/Schema/schema/** — unmodified by the regeneration"

      # .gitlab-ci.yml:435, carried verbatim. Read of the paths, not an assumption:
      # `ls -d tests/Schema tests/DataCore` both resolve, and `vendor/bin/phpunit`
      # accepts multiple paths, so ONE invocation of each suite is what the source
      # runs — not two separate invocations.
      #
      # These run against the COMMITTED tree, which is the point of them: after the
      # drift check above, the committed bytes are provably what a fresh generation
      # produces, so a failure here is a real property of the generated schema and
      # not an artefact of a stale checkout.
      - name: PHPUnit — the Schema and DataCore suites
        run: vendor/bin/phpunit tests/Schema tests/DataCore

  # ───────────────────────────────────────────────────────────────────────────
  # standalone-smoke — the plain-PHP constructibility sweep
  #
  # It is its OWN job here, and in the source it was a STEP inside `verify:8.3`
  # (.gitlab-ci.yml:250) and `verify:8.4` (.gitlab-ci.yml:264). It is lifted out
  # for one reason: in the source it ran on BOTH PHP matrix legs, so the sweep was
  # paid for twice and its red could not be attributed to a PHP version. As its
  # own job it has one addressable result.
  #
  # WHAT EXIT 0 MEANS — carried from bin/standalone-smoke.php:7-11 and NOT
  # restated loosely: the sweep runs with PRODUCTION dependencies only (no
  # testbench, no laravel/framework boot) and exit 0 means THE WHOLE TELEFRAME
  # MODULE SURFACE IS STANDALONE-CONSTRUCTIBLE. Every module is constructed
  # through plain PHP with no framework container behind it. A non-zero exit is
  # the gate firing, and it is the ONLY thing that exit code means — it is not a
  # general health signal and it does not mean "tests failed".
  #
  # composer.json:88 defines the script as `php bin/standalone-smoke.php`, and
  # `composer verify` (composer.json:91-96) invokes it as `@smoke` after
  # guard/test/stan. `composer smoke` is used below so the port and the source
  # name the same entry point rather than two spellings of it.
  #
  # Its phpunit mirror is tests/Standalone/PlainPhpLoadTest.php, which
  # bin/standalone-smoke.php:14 asks to be kept in lockstep; it is NOT run here
  # because the sharded-suite lane owns tests/Standalone, and duplicating it
  # would be a second, weaker home for the same rule.
  # ───────────────────────────────────────────────────────────────────────────
  standalone-smoke:
    name: standalone-smoke (every module plain-PHP-constructible)
    runs-on: ubuntu-latest
    # Sized, not guessed, and the derivation is recorded because there is no
    # isolated measurement of this step in the source.
    #
    # .gitlab-ci.yml:237-243 measured the WHOLE of `verify:8.3` — composer
    # validate + composer install + composer guard + composer stan + composer
    # smoke — at 362s on pipeline 957, under `timeout: 45m`. Smoke is one of those
    # five steps and it is not the expensive one; the install and the phpstan
    # analysis dominate. 15m is therefore more than double the measured cost of
    # the ENTIRE set on the shared bare-metal runner, and the dominant cost of
    # this job is the same composer install that measurement already included.
    #
    # It is deliberately NOT 45m: that budget was shared with the credential
    # guard's full-history walk and phpstan over src, neither of which runs here,
    # and inheriting it would make a genuine hang wait three quarters of an hour.
    # It is deliberately NOT smaller: a timeout that can fire on a healthy runner
    # is a coin, and the source's own position on that is recorded in this file's
    # `COMPOSER_PROCESS_TIMEOUT` comment.
    timeout-minutes: 15
    container: php:8.4-cli
    env:
      # Same value and same reasoning as regen-idempotence above — one number for
      # the file, sized against the measured SHARD budget so a sibling lane's job
      # is not constrained by this one's runtime.
      COMPOSER_PROCESS_TIMEOUT: "3600"
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /root/.composer/cache
    steps:
      # Setup BEFORE checkout for the same load-bearing reason as in
      # regen-idempotence: `php:8.4-cli` ships no git, and a git-less checkout
      # degrades to a REST tarball with no history. See the regen-idempotence
      # setup step for the full reason.
      - name: Apt build deps + PHP extensions + composer (was .php-setup)
        run: |
          set -euo pipefail
          # Unlike credential-guard, these packages are NOT optional:
          # docker-php-ext-install below compiles against libgmp-dev / libzip-dev
          # / libpq-dev / libicu-dev, and the job cannot run its suite without the
          # extensions they build. So a failure here IS fatal — but it is reported
          # as a NAMED environment failure rather than left as an anonymous apt
          # exit code, so the next reader can tell "the runner is broken" from
          # "the package is broken" without opening the job log archaeology.
          # `--no-install-recommends` + the clean below are what keep the archives
          # from becoming the next "not enough free space in /var/cache/apt/archives".
          apt-get update -qq || echo "apt-get update FAILED on this runner — if the next line fails too, this is a RUNNER disk/network problem, not a package problem"
          apt-get install -y -qq --no-install-recommends git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev >/dev/null || { echo "FATAL — apt could not install the REQUIRED build deps (git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev)."; echo "        docker-php-ext-install cannot build gmp/zip/pdo_pgsql/intl without them, so this job cannot verify anything."; echo "        If the message above mentions free space or an unsigned repo, the RUNNER is degraded and no code was tested."; exit 1; }
          apt-get clean && rm -rf /var/lib/apt/lists/*
          # `intl` for a named reason: composer.json requires ext-intl, and
          # Normalizer is what makes message search tokens NFC-canonical
          # (MessageSearchIndexer::toNfc). `bin/standalone-smoke.php` opens the
          # autoloader on line 15, so without this extension the job dies on the
          # platform requirement before constructing a single module — and it
          # would die looking exactly like a package failure.
          docker-php-ext-install bcmath gmp zip pdo_pgsql sockets intl >/dev/null
          # The official php:*-cli images ship memory_limit=128M. The full suite
          # peaks around 235M, so raise it before anything runs rather than
          # letting a container default decide whether the gate passes.
          printf "memory_limit=1G\n" > /usr/local/etc/php/conf.d/ci-memory.ini
          php -r 'printf("memory_limit=%s\n", ini_get("memory_limit"));'
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --quiet
          composer --version

      # fetch-depth: 0 — the full-history requirement is a COVERAGE requirement,
      # not a speed preference. Full reasoning in the regen-idempotence checkout
      # step; the one-line form: a shallow clone is a DISABLED GATE, because
      # bin/scan-credentials.php scans git HISTORY and a truncated object set
      # cannot see an exposure 84 commits back (pipeline #206 was GREEN on that
      # guard with a live Telegram session outside the window).
      - name: Checkout (FULL history — see the fetch-depth comment)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same mechanical proof of full history, for the same reason: see the
      # regen-idempotence step. Threshold 20 = Actions' default depth, so any
      # count at or below it is a truncated fetch.

      # `actions/checkout@v4` does NOT mark the checkout as safe. The Actions
      # runner checks the tree out as a different UID than the job shell runs
      # as, so every `git` command afterwards refuses with `fatal: detected
      # dubious ownership in repository at '$GITHUB_WORKSPACE'` and exits 128.
      # Measured: the public-surface gate failed exactly this way, and
      # `git ls-files` is how that gate enumerates the public surface — so
      # this step is load-bearing for it, not a convenience.
      - name: Trust the checkout (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Assert the clone is NOT shallow (a disabled gate must fail loudly)
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          shallow=$(git rev-parse --is-shallow-repository)
          echo "commits reachable from HEAD — ${count}"
          if [ "$shallow" = "true" ]; then
            echo "FATAL — the clone is shallow (${count} commits). bin/scan-credentials.php"
            echo "        scans git HISTORY, so a shallow clone turns the credential guard into a"
            echo "        no-op that still prints a success message. This is a DISABLED GATE, not a"
            echo "        speed optimisation. Fix `fetch-depth` before reading anything else."
            exit 1
          fi

      # Composer cache — same block, same INTENT and same reasoning as in
      # regen-idempotence, inlined per job because Actions has no anchor syntax.
      # Read the regen-idempotence copy for why the key is project-namespaced,
      # lockfile-keyed, and deliberately NOT keyed on the ref.
      - name: Composer cache (project-namespaced, lockfile-keyed, NOT ref-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: teleframe-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            teleframe-composer-${{ runner.os }}-

      # .gitlab-ci.yml:251 and :265 — the `composer install` those two jobs ran
      # before `composer smoke`. `composer validate --strict --no-check-publish`
      # is NOT carried here: it is a manifest gate, it belongs to the verify
      # lane that already runs it, and adding it here would be a second home for
      # one rule. Same for the `composer guard` / `composer stan` steps that sat
      # beside it — those are the credential guard's and phpstan's jobs.
      - name: composer install
        run: composer install --no-interaction --prefer-dist

      # .gitlab-ci.yml:251 / :265 — `composer smoke`, which composer.json:88
      # defines as `php bin/standalone-smoke.php`.
      #
      # Exit 0 = every module in the teleframe surface is plain-PHP-constructible,
      # with production dependencies only. Any non-zero exit is this gate firing.
      - name: standalone smoke (exit 0 = every module plain-PHP-constructible)
        run: composer smoke

# ─────────────────────────────────────────────────────────────────────────────
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  `host-install` IS NOW PORTED — IT LIVES IN ITS OWN WORKFLOW. This block  ║
# ║  used to say the opposite, and the thing it said was FALSE.               ║
# ║                                                                           ║
# ║  WHAT CHANGED, stated plainly because the old text here was a lie:        ║
# ║  commit ddbdef18 ("ci: move CI/CD to GitHub Actions") DELETED the         ║
# ║  `host-install` job from .gitlab-ci.yml. The claim in the version of this ║
# ║  block that read "it lives in .gitlab-ci.yml:437-470 … and it STAYS THERE ║
# ║  … still runs on the GitLab side" became false the moment those lines     ║
# ║  were                                                                     ║
# ║  deleted — the cited line numbers now fall inside `warm-live-host`'s      ║
# ║  script block. The gate was a SCRIPT NOBODY RAN, and this block is WHY    ║
# ║  nobody noticed: it read as a recorded decision and was trusted as one.   ║
# ║  It is caught now by tests/Standalone/HostInstallGateTest::               ║
# ║  test_ci_runs_the_host_install_gate, which scans every CI surface and     ║
# ║  rejects an invocation that is only MENTIONED in a comment.               ║
# ║                                                                           ║
# ║  WHERE IT LIVES NOW: .github/workflows/host-install.yml, job              ║
# ║  `host-install`, running `php bin/prove-host-install.php` on push and on  ║
# ║  pull_request with a real, unconditional trigger. That file carries the   ║
# ║  full port rationale; this block records only that the exclusion is over. ║
# ║                                                                           ║
# ║  WHY THE THREE OLD REASONS NO LONGER HOLD. All three were reasoned about  ║
# ║  a SHARED BARE-METAL GitLab runner, and none of them is a property of the ║
# ║  WORK rather than of the machine it used to run on:                       ║
# ║                                                                           ║
# ║  1. "needs network egress to Packagist for the Laravel install." A        ║
# ║  GitHub-hosted runner has ordinary general internet egress, and           ║
# ║  `composer create-project laravel/laravel` is about the most standard     ║
# ║  public-network operation there is. The gate uses NO credentials and      ║
# ║  NO Telegram session — its only env inputs are TELEFRAME_HOST_TMPDIR      ║
# ║  and TELEFRAME_HOST_KEEP, both optional — and the host it builds is       ║
# ║  deliberately UNCONFIGURED. Nothing in the job reaches Telegram or        ║
# ║  any secret.                                                              ║
# ║                                                                           ║
# ║  2. "mutates a host, so it opts out of interruptible: true." The host it  ║
# ║  mutates is a THROWAWAY under the runner's own /tmp, which the hosted     ║
# ║  VM discards with the job. The source's actual concern — an               ║
# ║  interrupted host proves nothing about the package — is honoured on       ║
# ║  its own terms by `concurrency: cancel-in-progress: false` in the new     ║
# ║  file. THAT is also the mechanical reason the job is a separate file      ║
# ║  rather than a job here: this file's group runs with                      ║
# ║  `cancel-in-progress: true`, so a superseded regen push would cancel      ║
# ║  a half-built host, handing the job the exact property its source         ║
# ║  refuses. Separate file, separate group, separate policy.                 ║
# ║                                                                           ║
# ║  3. "carries resource_group because seven CI projects share one           ║
# ║  bare-metal                                                               ║
# ║  runner." There is no shared machine left to serialise against — every    ║
# ║  hosted job run gets a fresh ephemeral VM. `concurrency: group:           ║
# ║  teleframe-host-install` is still declared in the new file because the    ║
# ║  source declared it and it costs nothing, but it is now                   ║
# ║  belt-and-braces rather than the mechanism. It is also NOT declared       ║
# ║  HERE, which is reason (3) restated correctly this time: a                ║
# ║  `concurrency:` group is per-WORKFLOW in Actions, so putting it on        ║
# ║  this file WOULD have serialised this file's gates against the            ║
# ║  host-install lane.                                                       ║
# ║                                                                           ║
# ║  IT IS NOT A STUB. The new job runs the real script unconditionally; it   ║
# ║  is                                                                       ║
# ║  not `if: false`, not behind an unset secret, and not under `when: never` ║
# ║  — all three of which the reachability test rejects. A stub would be a    ║
# ║  green check mark on a gate that checks nothing, which is the shape this  ║
# ║  file has a standing rule against.                                        ║
# ║                                                                           ║
# ║  BUDGET, carried UNCHANGED from .gitlab-ci.yml:453-458: 45m, raised there ║
# ║  from a measured 73s on pipeline 957. Its floor is a network install of a ║
# ║  whole Laravel application, so the headroom is against a slow or          ║
# ║  contended network.                                                       ║
