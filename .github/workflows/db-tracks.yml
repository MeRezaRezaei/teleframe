# ─────────────────────────────────────────────────────────────────────────────
# db-tracks.yml — the PostgreSQL and MySQL verification tracks, ported from
# GitLab CI to GitHub Actions. THE .gitlab-ci.yml FILE WAS THE SPECIFICATION:
# every command, every flag, every budget and every WHY-comment below is
# carried across from it rather than re-invented here. Nothing in this file was
# taken from a tutorial or a blog.
#
# REPLACES THESE RANGES OF .gitlab-ci.yml (the file stays, because GitLab is
# demoted to exactly one job — private/public separation, D-035 — so it is still
# the record of what used to run here):
#
#   .gitlab-ci.yml:1-31     header comments · stages (guard/verify/regen/
#                           host-install/pg/mysql) · the note that MySQL sits
#                           IMMEDIATELY AFTER pg so the two DB-backed lanes read
#                           side by side
#   .gitlab-ci.yml:54-66    GIT_DEPTH: 0 → `fetch-depth: 0`
#   .gitlab-ci.yml:70-103   COMPOSER_PROCESS_TIMEOUT: "3600"
#   .gitlab-ci.yml:105-136  the .php-setup anchor
#   .gitlab-ci.yml:138-157  the composer `cache:` block
#   .gitlab-ci.yml:159-177  `default: interruptible: true`
#   .gitlab-ci.yml:472-539  pg-tests          (stage pg)
#   .gitlab-ci.yml:541-584  the MySQL WHY block above `mysql-tests:`
#   .gitlab-ci.yml:585-717  mysql-tests       (stage mysql, `needs: []`)
#
# ── WHY THESE TWO TRACKS EXIST AT ALL, carried so a future reader does not
# ── "simplify" them away. This is the source's own argument:
# Every foreign-key claim in this repository has been proved on SQLite with
# `PRAGMA foreign_keys = ON`. That pragma is a real gate — SQLite does enforce
# FKs when it is on — but SQLite's dialect cannot express any of the rejections
# MySQL is famous for, and those are exactly the failures a 637-migration
# generated schema set is most likely to contain:
#
#   * 3780 — a FOREIGN KEY column's SIGNEDNESS disagrees with the referenced
#     key (`bigint` vs `unsigned bigint`). SQLite compares values, never types,
#     so it accepts this silently; MySQL refuses the DDL.
#   * 6125 — the referenced column is not covered by a UNIQUE/PK index. SQLite
#     permits the reference; MySQL rejects it outright.
#   * 1059 — a constraint name longer than the 64-character identifier limit.
#     SQLite has no such limit, so an over-long generated name passes here.
#   * 1170 — a TEXT/BLOB column used in a PRIMARY KEY. SQLite tolerates it.
#   * 1101 — a TEXT column declared `NOT NULL DEFAULT ''`.
#
# So the entire FK story this package tells was, until now, a SQLite story.
# Deleting either job below returns that project to a state where it is again.
#
# ── AND THE ONE TEST THAT LOOKS LIKE IT COVERS THIS PROVES NOTHING ABOUT
# ── ACCEPTANCE. tests/Schema/MySqlDialPortabilityTest.php SCANS THE MIGRATION
# ── SOURCE TEXT — it greps the generated SQL and asserts patterns. Reading SQL
# ── is not executing it. It cannot see whether the server ACCEPTS the statement;
# ── it can only see whether the string looks the way someone hoped it looks. A
# ── source scan is a lint, and no lint has ever proven an engine will accept a
# ── schema.
# ── CONSEQUENCE FOR THIS FILE, and it is a "do not add it" instruction:
# `tests/Schema/MySqlDialPortabilityTest.php` is DELIBERATELY NOT listed in
# `mysql-tests` below. It is not run by the GitLab job either — it lives in the
# `Schema` testsuite, which `composer verify` runs (the `verify` / `verify-shards`
# lanes own that). It is where the documented utf8mb4 255-CHARACTER STRING RULE
# is asserted (`string('id', 255)`) and where the 40-line soft trigger on
# functions is asserted. Those are real assertions and they stay asserted — in
# the suite that already runs them. Listing them here would add a second, weaker
# home for the same rules, which is a contradiction risk, not coverage.
#
# ── ON THE ORDERING OF THE TWO JOBS. GitLab put MySQL in a stage AFTER pg so
# ── the two DB-backed lanes sit together for a reader comparing them. Actions
# ── has no stages at all: every job in a workflow starts as soon as the
# ── workflow starts. The adjacency the source wanted is therefore preserved in
# ── the only place Actions can preserve it — THIS FILE holds exactly these two
# ── jobs, and `pg-tests` is declared before `mysql-tests`. Nothing else lives
# ── here, so a reader opening this file sees pg and mysql side by side in the
# ── order the source chose.
#
# ── WHY THE SETUP BLOCK IS REPEATED INSTEAD OF BEING A COMPOSITE ACTION.
# GitLab expressed it as the anchor `.php-setup: &php-setup` and every job
# merged it. GitHub Actions has NO YAML anchors and no merge-key syntax at all,
# so the only way to share the block is a composite action under
# .github/actions/. That is deliberately NOT done here: several lanes are
# porting their jobs out of the same .gitlab-ci.yml in parallel right now, and a
# shared .github/actions/php-setup is a write-write collision on a file nobody
# owns. It is owed, it is named, and it is not created while the port is in
# flight — an inline copy per job is duplicated, but each job stays
# independently readable and independently editable, which is what a reviewer of
# one lane needs.
#
# ── CONVENTIONS CARRIED FROM THE SOURCE. Em-dashes instead of ": " inside
# ── unquoted messages, for the reason recorded at .gitlab-ci.yml:196-199 (a
# ── bare YAML scalar containing ": " is parsed as a MAPPING, and a whole
# ── pipeline then fails to lint). Every message a step prints is therefore
# ── safe in a `run:` block without quoting.
# ─────────────────────────────────────────────────────────────────────────────

name: db-tracks

# `default: interruptible: true` (.gitlab-ci.yml:159-169) → this is its
# Actions-native form. GitLab's reason, carried: a newer pipeline supersedes an
# older one on the same branch, so the older run is wasted runner time. GitLab
# had to put it under `default:` because it rejects `interruptible` at the root
# with "jobs concurrent config should implement the script:, run:, or trigger:
# keyword"; Actions has no such lint, so the root is correct here.
#
# Neither job below is `interruptible: false` in the source: `host-install` and
# `warm-live-host` opt out because they MUTATE A HOST, and these two tracks
# mutate nothing outside their own service container.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# .gitlab-ci.yml:43-52 `workflow: rules:` ran the ordinary gates on push and
# merge-request, and ADDED (not replaced) schedule/api/web so a nightly pipeline
# could reach the warm lane. No `schedule:` is registered in THIS file on
# purpose: the GitLab cron existed to reach `warm-live-host`, which is
# `when: never` and is not ported into this file. Whoever ports the warm lane
# owns adding the cron; registering one here would burn hosted minutes on a
# schedule whose only purpose was to reach a disabled lane.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. These tracks read the repository and drive their own
# throwaway service containers; nothing here pushes, publishes, or writes a
# package.
permissions:
  contents: read

# Deterministic shell. The `php:8.4-cli` image's /bin/sh is dash, and the
# GitLab fences below were written against a bash-ish shell on the GitLab runner;
# naming bash makes the port's semantics explicit instead of inheriting the
# container's.
defaults:
  run:
    shell: bash

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # pg-tests — PostgreSQL track (.gitlab-ci.yml:472-539)
  #
  # "pg -> PostgreSQL track (native uuid, DEFERRABLE FKs, full 637-migration
  # generated set) against a postgres:17 service" — the stage-list comment,
  # carried.
  #
  # `image: php:8.4-cli` + `services:` is GitLab's shape. Its Actions-native
  # equivalent is a JOB CONTAINER plus `services:` — deliberately not a
  # `runs-on: ubuntu-latest` with a hand-installed PHP:
  #   * it is the faithful port of the image, and
  #   * it is what makes `docker-php-ext-install` available, because that
  #     function ships IN the php:*-cli images and nowhere else. A hand-rolled
  #     `apt-get install php8.4` could not run .php-setup at all.
  # Inside a job container, a service is reachable at its service LABEL as the
  # hostname — which is why every host below is still the bare label
  # `postgres` / `mysql`, exactly as GitLab's `alias:` set it, with no
  # `localhost`, no `172.17.0.x`, and no port collision with the runner.
  # ───────────────────────────────────────────────────────────────────────────
  pg-tests:
    name: pg-tests (postgres:17)
    runs-on: ubuntu-latest
    # `timeout: 30m` (.gitlab-ci.yml:476), unchanged — NOT rounded, NOT raised.
    # It is the whole-job budget in GitLab and it is the whole-job budget here:
    # in GitLab the 30m clock covers `before_script` and service startup, and in
    # Actions `timeout-minutes` starts BEFORE the service container is even
    # pulled, so the service-startup cost is inside this budget in both systems.
    # Budgeting it any differently would make this job's red mean something
    # different from the red it replaced.
    timeout-minutes: 30
    container: php:8.4-cli
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teleproto_night_test
          POSTGRES_USER: me
          POSTGRES_PASSWORD: telegram
        # ── READINESS IS WAITED FOR, and Actions can do that where GitLab
        # ── could not. GitLab considers a service "ready" when its container
        # ── STARTS; the source says so and it is why the fence below exists.
        # Actions takes a real health command, so the job no longer races the
        # postmaster even before the fence runs. This is strictly MORE waiting
        # than the source, never less — and the fence is kept anyway, because a
        # health probe is not the same claim as "an authenticated connection in
        # the suite's own PDO configuration succeeds" (see the fence comment).
        options: >-
          --health-cmd "pg_isready -U me -d teleproto_night_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        ports:
          # GitLab published the service port implicitly. Kept explicit here so
          # the published surface is visible rather than implied.
          - 5432:5432
    env:
      # .gitlab-ci.yml:481-490, carried verbatim.
      POSTGRES_DB: teleproto_night_test
      POSTGRES_USER: me
      POSTGRES_PASSWORD: telegram
      TELEFRAME_PG: "1"
      TELEFRAME_PG_HOST: postgres
      TELEFRAME_PG_PORT: "5432"
      TELEFRAME_PG_DATABASE: teleproto_night_test
      TELEFRAME_PG_USER: me
      TELEFRAME_PG_PASSWORD: telegram
      # Composer's process-timeout is 300s by default. .gitlab-ci.yml:70-103
      # raised it to 3600 and the reasoning is the point, so it is carried:
      # a shard is budgeted at 1800s of measured test time (ci/shard-timings.md)
      # and 3600 is that budget with 2x headroom for a runner slower than the one
      # measured on. A gate that flips on machine speed is not a gate, it is a
      # coin. It is NOT the suite timeout — no shard is expected to need it, and
      # a shard that does has a real problem to report rather than a slow machine
      # to blame. The job's `timeout-minutes` above still bounds the run; this
      # only stops composer from killing its own child first.
      COMPOSER_PROCESS_TIMEOUT: "3600"
      # Root in the container. Without this, composer prints a loud warning per
      # command and the caches below are written by a user the runner's cleanup
      # does not look for.
      COMPOSER_ALLOW_SUPERUSER: "1"
      # Point composer AT the directory the cache step stores, so the cache is a
      # real warm cache rather than a directory nothing ever writes to. On Linux
      # composer's default cache dir is ~/.cache/composer, which is NOT the
      # ~/.composer/cache/ the source cached; these two jobs pin it to the
      # source's path on purpose so the port and the original warm the same bytes.
      COMPOSER_CACHE_DIR: /root/.composer/cache
    steps:
      # ── SETUP FIRST, BEFORE CHECKOUT, AND THE ORDER IS LOAD-BEARING ─────────
      # .php-setup (.gitlab-ci.yml:105-136), inlined because Actions has no
      # anchor syntax (see the header).
      #
      # WHY IT RUNS BEFORE CHECKOUT HERE, which is the reverse of a conventional
      # Actions file: `php:8.4-cli` DOES NOT SHIP GIT. actions/checkout then
      # falls back to downloading a REST API tarball instead of cloning, and a
      # tarball has NO HISTORY — which would silently reduce `fetch-depth: 0`
      # (see the checkout step) to the exact "disabled gate" the source calls a
      # non-negotiable. Installing git first is what makes the full-history
      # requirement real rather than merely written down. GitLab's runner injects
      # its own tooling and never had this problem; Actions does not.
      - name: Apt build deps + PHP extensions + composer (was .php-setup)
        run: |
          set -euo pipefail
          # Unlike credential-guard, these packages are NOT optional:
          # docker-php-ext-install below compiles against libgmp-dev / libzip-dev
          # / libpq-dev / libicu-dev, and the job cannot run its suite without the
          # extensions they build. So a failure here IS fatal — but it is reported
          # as a NAMED environment failure rather than left as an anonymous apt
          # exit code, so the next reader can tell "the runner is broken" from
          # "the package is broken" without opening the job log archaeology.
          # `--no-install-recommends` + the clean below are what keep the archives
          # from becoming the next "not enough free space in /var/cache/apt/archives".
          apt-get update -qq || echo "apt-get update FAILED on this runner — if the next line fails too, this is a RUNNER disk/network problem, not a package problem"
          apt-get install -y -qq --no-install-recommends git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev >/dev/null || { echo "FATAL — apt could not install the REQUIRED build deps (git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev)."; echo "        docker-php-ext-install cannot build gmp/zip/pdo_pgsql/intl without them, so this job cannot verify anything."; echo "        If the message above mentions free space or an unsigned repo, the RUNNER is degraded and no code was tested."; exit 1; }
          apt-get clean && rm -rf /var/lib/apt/lists/*
          # `intl` is here for a named reason, not for tidiness: composer.json
          # requires ext-intl, and Normalizer is what makes message search tokens
          # NFC-canonical (MessageSearchIndexer::toNfc). Without it
          # `composer install` fails on the platform requirement in EVERY job
          # that uses this anchor, so a missing line here reads as a total CI
          # outage rather than as one extension. libicu-dev is the build
          # dependency; the official php:*-cli images ship none of this, exactly
          # like bcmath/gmp/zip above.
          docker-php-ext-install bcmath gmp zip pdo_pgsql sockets intl >/dev/null
          # The official php:*-cli images ship memory_limit=128M. The suite peaks
          # around 235M (it fatals in guzzlehttp/psr7 Stream inside
          # AwsSdkS3GatewayTest at 128M), so raise it before anything runs rather
          # than letting a container default decide whether the gate passes.
          printf "memory_limit=1G\n" > /usr/local/etc/php/conf.d/ci-memory.ini
          php -r 'printf("memory_limit=%s\n", ini_get("memory_limit"));'
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --quiet
          composer --version

      # GIT_DEPTH: 0 → `fetch-depth: 0`. NON-NEGOTIABLE, and the reasoning is
      # carried from .gitlab-ci.yml:54-66 because this is the single setting most
      # likely to be "tidied up" by someone who has not read what it is for.
      #
      # A SHALLOW CLONE IS A DISABLED GATE, not a speed optimisation.
      #
      # bin/scan-credentials.php scans git HISTORY for committed session strings.
      # At the default depth 20 the runner's object set is truncated, so the guard
      # could not see an exposure 84 commits back — while still printing
      # "history depth all reachable from all". Pipeline #206 was GREEN on the
      # credential-guard job with a live Telegram session sitting outside the
      # window, and the only visible symptom was an unrelated test asserting a
      # receipt that the truncated clone could not reach.
      #
      # GIT_DEPTH: 0 fetches the full history, so the guard's coverage claim
      # becomes true and the receipt ratchet in
      # tests/Credentials/RepositoryGuardTest.php can pass honestly. Clone time is
      # the cost; a gate that cannot see is not a gate.
      #
      # actions/checkout@v4 handles the git `safe.directory` ownership question
      # itself (the checkout writes files owned by root while the container's
      # workspace is owned by the runner user), so no manual `git config
      # --global --add safe.directory` is added here — that would be a second
      # home for the same fix.
      - name: Checkout (FULL history — see the fetch-depth comment)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PROVE THE HISTORY IS THERE, mechanically, because "NON-NEGOTIABLE" that
      # nothing checks is a wish. The check is seconds-long, not a test suite.
      #
      # The threshold is 20 because 20 is Actions' DEFAULT depth: any count at or
      # below it is the signature of a truncated fetch (including the
      # checkout-fallback-without-git case described above, which yields 1). The
      # repository has hundreds of commits, so 20 is a floor that cannot produce
      # a false red while catching every truncation.

      # `actions/checkout@v4` does NOT mark the checkout as safe. The Actions
      # runner checks the tree out as a different UID than the job shell runs
      # as, so every `git` command afterwards refuses with `fatal: detected
      # dubious ownership in repository at '$GITHUB_WORKSPACE'` and exits 128.
      # Measured: the public-surface gate failed exactly this way, and
      # `git ls-files` is how that gate enumerates the public surface — so
      # this step is load-bearing for it, not a convenience.
      - name: Trust the checkout (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Assert the clone is NOT shallow (a disabled gate must fail loudly)
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          shallow=$(git rev-parse --is-shallow-repository)
          echo "commits reachable from HEAD — ${count} (shallow=${shallow})"
          echo "commits reachable from HEAD — ${count}"
          if [ "$shallow" = "true" ]; then
            echo "FATAL — the clone is shallow (${count} commits). bin/scan-credentials.php"
            echo "        scans git HISTORY, so a shallow clone turns the credential guard into a"
            echo "        no-op that still prints a success message. This is a DISABLED GATE, not a"
            echo "        speed optimisation. Fix `fetch-depth` before reading anything else."
            exit 1
          fi

      # Composer cache. Ported from .gitlab-ci.yml:138-157, keeping its INTENT and
      # its reasoning rather than its syntax:
      #
      # Project-namespaced and lockfile-keyed, NOT a bare ref slug.
      #
      # A ref-slug key minted a BRAND NEW cache directory per branch, so
      # ~/.composer/cache was re-downloaded from scratch on every fresh branch and
      # never shared between them. The slug also carried no project name, so the
      # key space collided with the other CI projects sharing that one bare-metal
      # runner — and cache collisions between projects serve each other the wrong
      # packages. The Actions form of that failure would be `${{ github.ref }}` or
      # `github.head_ref` in the key, and it is therefore DELIBERATELY ABSENT.
      #
      # This repository is a LIBRARY and .gitignore excludes composer.lock, so
      # `hashFiles('composer.lock')` resolves to the EMPTY STRING today — the
      # direct equivalent of the `files:` list resolving to nothing and GitLab
      # falling back to the static `prefix`. One shared, project-namespaced
      # directory for every branch is the intended outcome, and the hash is kept
      # so the key starts tracking the real lockfile the moment the project
      # commits one.
      #
      # The cross-project collision cannot recur on GitHub-hosted runners, because
      # a repository's Actions cache is already scoped to that repository. The
      # explicit `teleframe` segment is kept anyway: it costs nothing, it makes
      # the key read identically to the one it replaces, and it keeps the key
      # unique if a self-hosted runner with a shared cache is ever reintroduced.
      - name: Composer cache (project-namespaced, lockfile-keyed, NOT ref-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: teleframe-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            teleframe-composer-${{ runner.os }}-

      # .gitlab-ci.yml:492-493
      - name: composer validate + install
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist

      # ── FENCE: WAIT FOR POSTGRES TO ACCEPT CONNECTIONS ─────────────────────
      # Carried VERBATIM from .gitlab-ci.yml:494-538, including its reason.
      #
      # Measured failure, pipeline 968 (commit 2c5e82e3): 11 tests, 0 assertions,
      # 11 errors, every one of them
      #     SQLSTATE[08006] connection to server at "postgres" (172.17.0.7),
      #     port 5432 failed: Connection refused
      # on BOTH IPv4 and the IPv6 address. The container had an IP and a port, so
      # the service was scheduled and reachable — it simply was not listening yet.
      # `docker-php-ext-install pdo_pgsql` above takes tens of seconds, and GitLab
      # considers a service "ready" when its container starts, not when its
      # postmaster accepts TCP. The suite therefore races initialisation, and
      # pipeline 957 had passed 90 seconds earlier on the same code.
      #
      # A gate that flips on how fast a container boots is not a gate, it is a
      # coin. This is the same shape as the CI failures this project already
      # records (apt running out of disk, an unsigned Debian repo) except that
      # this one is ours rather than the runner's, so it is ours to fix.
      #
      # The check is a real connection attempt, not a port probe: postgres can
      # hold the port open while initialising the data directory, and only a
      # successful authenticated connection proves it can serve these tests.
      # Bounded at 60s, which is generous for a warm volume and short enough to
      # fail visibly.
      #
      # NOTE: there is NO `psql` client here, and there is none in GitLab either —
      # `php:8.4-cli` does not ship one and the source never installed it. The
      # readiness probe above uses `pg_isready` INSIDE the postgres service
      # image, where it does exist; this fence deliberately uses the same PDO
      # client and the same DSN the suite will use, which is a stronger claim.
      - name: Fence — wait for postgres to accept an AUTHENTICATED connection
        run: |
          set -euo pipefail
          php -r '
            $deadline = time() + 60;
            $dsn = sprintf("pgsql:host=%s;port=%s;dbname=%s",
                getenv("TELEFRAME_PG_HOST"), getenv("TELEFRAME_PG_PORT"), getenv("TELEFRAME_PG_DATABASE"));
            $attempt = 0;
            while (time() < $deadline) {
                $attempt++;
                try {
                    new PDO($dsn, getenv("TELEFRAME_PG_USER"), getenv("TELEFRAME_PG_PASSWORD"),
                        [PDO::ATTR_TIMEOUT => 3, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                    echo "postgres ready after {$attempt} attempt(s)\n";
                    exit(0);
                } catch (Throwable $e) {
                    fwrite(STDERR, "  attempt {$attempt}: not ready yet\n");
                    sleep(2);
                }
            }
            fwrite(STDERR, "FATAL: postgres never became ready within 60s.\n");
            fwrite(STDERR, "The service container started but never accepted an authenticated\n");
            fwrite(STDERR, "connection. That is a service/runner problem, not a package failure --\n");
            fwrite(STDERR, "no test was executed.\n");
            exit(1);
          '

      # .gitlab-ci.yml:539
      - name: PHPUnit — the PostgreSQL track
        run: vendor/bin/phpunit tests/Pg

  # ───────────────────────────────────────────────────────────────────────────
  # mysql-tests — MySQL track (.gitlab-ci.yml:541-717)
  #
  # THE MYSQL TRACK — the engine that had never been in the pipeline at all.
  #
  # WHY THIS JOB HAS TO EXIST, and it is not "we would like MySQL coverage". The
  # full argument (the five SQLite-cannot-express rejections 3780 / 6125 / 1059 /
  # 1170 / 1101, and why the source-scan portability test proves nothing about
  # ACCEPTANCE) is in this file's header rather than here, so that it is read
  # before either job is deleted.
  #
  # AND THE ONE PLACE THE GAP WAS ADMITTED, IN CODE, IS NOW CLOSED.
  # tests/Schema/Mirror/RepeatedEntityConvergesTest.php skips its only live-engine
  # case with the stated excuse "the CI matrix provides postgres:17 and no MySQL".
  # That excuse was true and is true no longer: the matrix now carries mysql:8.4,
  # so the skip can go and the convergence claim can be proved where it is
  # actually load-bearing. This job is what makes that claim true rather than
  # aspirational.
  #
  # WHY `pdo_mysql` IS INSTALLED HERE AND NOT IN THE SHARED SETUP. The shared
  # block installs `bcmath gmp zip pdo_pgsql sockets intl` — verified by reading
  # it — and composer.json requires no ext-*mysql*. The official php:*-cli
  # images do not bundle pdo_mysql either, so without the line below this job
  # dies with "could not find driver" before a single test runs, and it would die
  # looking exactly like a package failure. It is installed HERE, not in the
  # shared setup, because the shared setup is used by every other job and adding
  # a MySQL build to all of them would tax jobs that have no use for it.
  #
  # ── `needs: []`, AND HOW THE ORDERING INTENT SURVIVED THE PORT ─────────────
  # .gitlab-ci.yml:591-612, carried because the reasoning is the whole point:
  #
  # RUNS IN PARALLEL WITH `verify`, NOT AFTER IT. Added 2026-10-05.
  #
  # The stage list is ordered guard -> verify -> regen -> host-install -> pg ->
  # mysql, so this job used to start only after the whole PHP matrix had
  # finished — and `verify` alone measures 30m+ on the full suite (tests/Ingest
  # exceeds 1800s standalone). Measured on pipeline 1586: `verify` ran 30m while
  # `mysql-tests` sat `created / not started` for the whole of it. The MySQL truth
  # track is the one the operator cares about most — "if a foreign key fails it
  # hits things all" — and it was the LAST thing to report.
  #
  # `needs: []` starts it as soon as the pipeline is created, because it is an
  # INDEPENDENT engine track: its own `mysql:8.4` service, its own pdo_mysql, its
  # own database. Nothing it does depends on the PHP matrix having passed.
  #
  # The point is not merely speed. A red `verify` and a green `mysql-tests`
  # LOCALISES a fault to the code rather than to the engine, which is the single
  # most informative split this project can get — and the reverse (green verify,
  # red mysql) says the schema is fine on SQLite and wrong on InnoDB, which is
  # exactly the class of defect SQLite cannot express: 1452, 3780, 6125, 1059,
  # 1170. Sequencing them together destroys that signal by letting the earlier
  # stage's colour stand in for the later one's.
  #
  # ACTIONS HAS NO `needs`. Its expression of the same intent is that a workflow
  # graph has no ordering unless one is declared: every job below starts as soon
  # as the workflow starts, bounded only by runner availability. That is
  # STRICTLY STRONGER than `needs: []` — GitLab still had to say `needs: []` to
  # opt out of its stage order, Actions never had one to opt out of — so the
  # behaviour is preserved with nothing to switch on. The one thing the port
  # cannot reproduce is the DIAGNOSTIC pairing itself: GitLab could report
  # "verify red / mysql green" from a single pipeline, while Actions reports two
  # independently-timed checks that a reader must compare by eye. Nothing is lost
  # in what the two lanes prove; the read-across is manual. Recorded here rather
  # than left to be discovered by a future reader comparing two badges.
  #
  # `fail-fast: false` is therefore implied and NOT set per job: there is no
  # matrix here, so there is nothing for it to apply to, and the two tracks must
  # both report regardless — which, as above, is the point of `needs: []`.
  # ───────────────────────────────────────────────────────────────────────────
  mysql-tests:
    name: mysql-tests (mysql:8.4)
    runs-on: ubuntu-latest
    # `timeout: 30m` (.gitlab-ci.yml:589), unchanged, for the same reason as
    # pg-tests above: whole-job budget, service startup included, in both
    # systems. Carried note — the MySql pass measured 1925s and died with SIGKILL
    # (exit 137) on a CONTENDED dev box during a PARALLEL run; it is absent from
    # ci/shard-timings-raw.tsv because those two tracks are deliberately NOT
    # sharded (ci/shard-timings.md: "tests/MySql and tests/Pg are deliberately not
    # sharded. They are owned by the mysql-tests and pg-tests jobs, which supply a
    # real mysql:8.4 / postgres:17 service and the matching driver"). A GitHub
    # hosted runner is a dedicated, non-shared machine and is faster than that
    # contended box, which is why 30m is not raised here: the 30m that was
    # measured sufficient on the contended box is not made less sufficient by
    # moving to a dedicated one.
    timeout-minutes: 30
    container: php:8.4-cli
    services:
      mysql:
        image: mysql:8.4
        env:
          # .gitlab-ci.yml:618-639, carried verbatim. mysql:8.4 ships
          # MYSQL_ALLOW_EMPTY_PASSWORD rather than an auth plugin that a PHP
          # client can negotiate, and MYSQL_ROOT_HOST "%" is what makes the root
          # account reachable from OUTSIDE the service container. Without it root
          # is local-only and every connection from the job container is refused —
          # which again reads as a package failure rather than a configuration
          # one.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          # THE BUG THAT KEPT THE MYSQL TRACK FROM EVER RUNNING A TEST. Added
          # 2026-10-05. Measured on pipeline 1588 (fence gave up at 90s) and again
          # on 1589 (fence gave up at 300s, 150 attempts) — raising the timeout
          # could never have helped, and it is worth recording why.
          #
          # The mysql image creates ONE database, the one named by MYSQL_DATABASE,
          # and creates NO others. This job set TELEFRAME_MYSQL_DATABASE but never
          # set MYSQL_DATABASE, so `teleframe_mysql_track` was never created by
          # the image. The fence then connects with `dbname=teleframe_mysql_track`,
          # which MySQL answers with "Unknown database" — forever. The service
          # was healthy the whole time; the fence was asking for a database that
          # did not exist.
          #
          # So the fence was never measuring readiness. It was measuring the
          # absence of a database, and reporting it as an unreachable service.
          # MYSQL_DATABASE is listed on the SERVICE as well as in the job env
          # below, because the image reads it at ITS first boot; a service env
          # entry is what makes the database exist in the container that the
          # fence connects to.
          MYSQL_DATABASE: teleframe_mysql_track
        # Readiness, waited for explicitly — see the postgres job's note. Same
        # reason, same "strictly more waiting than the source, never less". And
        # same limit on what a health probe proves: `mysqladmin ping` answers for
        # the SERVER, not for this PDO client with these credentials against this
        # database, which is why the fence below still exists and is still the
        # real gate.
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 3306:3306
    env:
      # .gitlab-ci.yml:640-645
      TELEFRAME_MYSQL: "1"
      TELEFRAME_MYSQL_HOST: mysql
      TELEFRAME_MYSQL_PORT: "3306"
      TELEFRAME_MYSQL_DATABASE: teleframe_mysql_track
      TELEFRAME_MYSQL_USER: root
      TELEFRAME_MYSQL_PASSWORD: ""
      # Same sizing and same reasoning as pg-tests — see there. Carried here
      # because each job carries its own budget rather than inheriting one.
      COMPOSER_PROCESS_TIMEOUT: "3600"
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /root/.composer/cache
    steps:
      # Setup runs BEFORE checkout for the same load-bearing reason as in
      # pg-tests: `php:8.4-cli` ships no git, and a git-less checkout degrades to
      # a REST tarball with no history, which is the "disabled gate" the fetch
      # comment below is about. See the pg-tests setup step for the full reason.
      - name: Apt build deps + PHP extensions + composer (was .php-setup)
        run: |
          set -euo pipefail
          # Unlike credential-guard, these packages are NOT optional:
          # docker-php-ext-install below compiles against libgmp-dev / libzip-dev
          # / libpq-dev / libicu-dev, and the job cannot run its suite without the
          # extensions they build. So a failure here IS fatal — but it is reported
          # as a NAMED environment failure rather than left as an anonymous apt
          # exit code, so the next reader can tell "the runner is broken" from
          # "the package is broken" without opening the job log archaeology.
          # `--no-install-recommends` + the clean below are what keep the archives
          # from becoming the next "not enough free space in /var/cache/apt/archives".
          apt-get update -qq || echo "apt-get update FAILED on this runner — if the next line fails too, this is a RUNNER disk/network problem, not a package problem"
          apt-get install -y -qq --no-install-recommends git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev >/dev/null || { echo "FATAL — apt could not install the REQUIRED build deps (git curl unzip libgmp-dev libzip-dev libpq-dev libicu-dev)."; echo "        docker-php-ext-install cannot build gmp/zip/pdo_pgsql/intl without them, so this job cannot verify anything."; echo "        If the message above mentions free space or an unsigned repo, the RUNNER is degraded and no code was tested."; exit 1; }
          apt-get clean && rm -rf /var/lib/apt/lists/*
          # `intl` for a named reason: composer.json requires ext-intl, and
          # Normalizer is what makes message search tokens NFC-canonical
          # (MessageSearchIndexer::toNfc). Without it `composer install` fails on
          # the platform requirement, so a missing line here reads as a total CI
          # outage rather than as one extension.
          docker-php-ext-install bcmath gmp zip pdo_pgsql sockets intl >/dev/null
          # The official php:*-cli images ship memory_limit=128M. The suite peaks
          # around 235M, so raise it before anything runs rather than letting a
          # container default decide whether the gate passes.
          printf "memory_limit=1G\n" > /usr/local/etc/php/conf.d/ci-memory.ini
          php -r 'printf("memory_limit=%s\n", ini_get("memory_limit"));'
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer --quiet
          composer --version

      # fetch-depth: 0 — the full-history requirement is a COVERAGE requirement,
      # not a speed preference, and it is identical in both jobs. Full reasoning
      # in the pg-tests checkout step; the one-line form: a shallow clone is a
      # DISABLED GATE, because bin/scan-credentials.php scans git HISTORY and a
      # truncated object set cannot see an exposure 84 commits back (pipeline
      # #206 was GREEN on that guard with a live Telegram session outside the
      # window).
      - name: Checkout (FULL history — see the fetch-depth comment)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same mechanical proof of full history, for the same reason: see the
      # pg-tests step. Threshold 20 = Actions' default depth, so any count at or
      # below it is a truncated fetch.

      # `actions/checkout@v4` does NOT mark the checkout as safe. The Actions
      # runner checks the tree out as a different UID than the job shell runs
      # as, so every `git` command afterwards refuses with `fatal: detected
      # dubious ownership in repository at '$GITHUB_WORKSPACE'` and exits 128.
      # Measured: the public-surface gate failed exactly this way, and
      # `git ls-files` is how that gate enumerates the public surface — so
      # this step is load-bearing for it, not a convenience.
      - name: Trust the checkout (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Assert the clone is NOT shallow (a disabled gate must fail loudly)
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          shallow=$(git rev-parse --is-shallow-repository)
          echo "commits reachable from HEAD — ${count}"
          if [ "$shallow" = "true" ]; then
            echo "FATAL — the clone is shallow (${count} commits). bin/scan-credentials.php"
            echo "        scans git HISTORY, so a shallow clone turns the credential guard into a"
            echo "        no-op that still prints a success message. This is a DISABLED GATE, not a"
            echo "        speed optimisation. Fix `fetch-depth` before reading anything else."
            exit 1
          fi

      # Composer cache — same block, same INTENT and same reasoning as in
      # pg-tests, inlined per job because Actions has no anchor syntax. Read the
      # pg-tests copy for why the key is project-namespaced, lockfile-keyed, and
      # deliberately NOT keyed on the ref.
      - name: Composer cache (project-namespaced, lockfile-keyed, NOT ref-keyed)
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: teleframe-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            teleframe-composer-${{ runner.os }}-

      # .gitlab-ci.yml:647-653, in SOURCE ORDER. pdo_mysql FIRST, before composer
      # even runs: mysqlnd is bundled in the image, so this needs no additional
      # apt package, and composer.json requires no ext-mysql, so nothing above
      # this line was waiting on a driver it did not have. The
      # PDO::getAvailableDrivers() print is kept because "could not find driver"
      # must be visible as a driver list, not as a test failure 600 lines later.
      - name: pdo_mysql + driver proof, then composer validate + install
        run: |
          set -euo pipefail
          docker-php-ext-install pdo_mysql >/dev/null
          php -r 'print_r(PDO::getAvailableDrivers());'
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist

      # ── FENCE: WAIT FOR MYSQL TO ACCEPT AN AUTHENTICATED CONNECTION ─────────
      # Carried VERBATIM from .gitlab-ci.yml:654-716, including its reason.
      #
      # Same shape and the same reasoning as the postgres fence above: a real
      # connection attempt, not a port probe, because mysql holds its port open
      # while it initialises and only an authenticated connection proves it can
      # serve these tests. Not `mysqladmin ping` either — that answers for the
      # server, not for this PDO client with these credentials.
      #
      # 300s, not 90s. Raised 2026-10-05 after MEASURED failure on pipeline 1588,
      # where the fence gave up after exactly 45 attempts and reported "mysql
      # never became ready within 90s ... no test was executed" — a service
      # readiness failure, NOT a code failure, and it cost the MySQL truth track
      # entirely.
      #
      # Why 90s was not enough, from that job's own trace: `Pulling docker image
      # mysql:8.4` took 28s, GitLab's own service wait is capped at 30s, and the
      # image INITIALISES A DATA DIRECTORY on first boot (unlike postgres on a
      # warm volume) before it will accept an AUTHENTICATED connection. On the
      # shared baremetal runner that cold start is slower still. 45 attempts was
      # simply under budget.
      #
      # 300s costs nothing when the service is healthy — the loop exits on the
      # first successful connection, so a warm run still returns in about two
      # seconds. It only matters on the slow path, which is exactly the path that
      # was red. The job's own `timeout: 30m` leaves ample room, so a 300s fence
      # cannot turn a service problem into a job timeout.
      #
      # CARRIED VERBATIM AND STILL TRUE HERE: the fence connects with
      # `dbname=teleframe_mysql_track`, and MYSQL_DATABASE above is what makes
      # that database exist. "Unknown database" in the LAST ERROR line means the
      # service is healthy and the DATABASE is missing — not that the service is
      # unreachable. This is the exact bug that cost the track two pipelines.
      - name: Fence — wait for mysql to accept an AUTHENTICATED connection
        run: |
          set -euo pipefail
          php -r '
            $deadline = time() + 300;
            $dsn = sprintf("mysql:host=%s;port=%s;dbname=%s",
                getenv("TELEFRAME_MYSQL_HOST"), getenv("TELEFRAME_MYSQL_PORT"), getenv("TELEFRAME_MYSQL_DATABASE"));
            $attempt = 0;
            $last = null;
            while (time() < $deadline) {
                $attempt++;
                try {
                    new PDO($dsn, getenv("TELEFRAME_MYSQL_USER"), getenv("TELEFRAME_MYSQL_PASSWORD"),
                        [PDO::ATTR_TIMEOUT => 3, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                    echo "mysql ready after {$attempt} attempt(s)\n";
                    exit(0);
                } catch (Throwable $e) {
                    $last = $e->getMessage();
                    // PRINT THE REAL REASON, at first and last. The previous version
                    // of this fence printed only "not ready yet", which is why a
                    // missing database was indistinguishable from an unreachable
                    // service for two whole pipelines: 45 attempts and then 150
                    // attempts of a message that carried no information. A fence
                    // that cannot say WHY it is failing is a fence that cannot be
                    // debugged.
                    if ($attempt === 1 || $attempt % 25 === 0) {
                        fwrite(STDERR, "  attempt {$attempt}: ".$last."\n");
                    }
                    sleep(2);
                }
            }
            fwrite(STDERR, "FATAL: mysql never became ready within 300s after {$attempt} attempt(s).\n");
            fwrite(STDERR, "LAST ERROR: ".($last ?? "(none)")."\n");
            fwrite(STDERR, "The service container started but never accepted an authenticated\n");
            fwrite(STDERR, "connection to dbname=".getenv("TELEFRAME_MYSQL_DATABASE").".\n");
            fwrite(STDERR, "Read the LAST ERROR line above before blaming the runner. An\n");
            fwrite(STDERR, "\"Unknown database\" means MYSQL_DATABASE is not creating the\n");
            fwrite(STDERR, "database this job asks for, and the service itself is healthy.\n");
            exit(1);
          '

      # .gitlab-ci.yml:717. tests/MySql — and NOT tests/Schema/MySqlDialPortabilityTest.php,
      # which is a source scan run by `composer verify` in the verify lanes. See
      # the file header for why that test is deliberately not named here.
      - name: PHPUnit — the MySQL track
        run: vendor/bin/phpunit tests/MySql
