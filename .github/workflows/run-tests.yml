name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: P${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, openssl, hash, json, gmp, bcmath, sodium, pdo, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
      - name: Validate manifest
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Full verify chain
        run: composer verify
